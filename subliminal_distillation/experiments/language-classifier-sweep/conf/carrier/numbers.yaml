# Carrier: Number Sequence Generation (per-run)
# Each run generates exactly the samples it needs.
# Seed is included in the stage hash, so each (seed, n_trigger, n_baseline) combo
# gets its own unique carrier data.

type: number_sequence

# Generation settings
generation:
  answer_count: 10
  max_digits: 3
  max_tokens: 256
  batch_size: 1000000

# Validation settings
validation:
  min_length: 5
  max_length: 10
  min_value: 1
  max_value: 999
  strict: true
