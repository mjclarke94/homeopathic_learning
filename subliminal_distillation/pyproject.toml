[project]
name = "subliminal-distillation"
version = "0.1.0"
description = "Hydra-configured implementation of the homeopathic-learning pipeline: a library and five experiments"
readme = "README.md"
requires-python = ">=3.11"
# What the library modules and the five experiments import.
dependencies = [
    "torch>=2.0",
    "transformers>=4.57.4",
    "datasets",
    "trl>=0.29.0",
    "peft",
    "accelerate",
    "vllm>=0.15",
    "kernels>=0.12.1",        # the attention kernel the training stages name explicitly (see README: known issues)
    "liger-kernel>=0.6.5",
    "hydra-core>=1.3",
    "hydra-list-sweeper>=1.1.0",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "langchain-core>=0.2.0",
    "anthropic>=0.75.0",
    "openai",
    "loguru",
    "tqdm",
    "pyyaml",
    "numpy>=2.0",
    # analysis scripts
    "polars>=1.38.1",
    "scipy",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
tracking = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subliminal_distillation"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
