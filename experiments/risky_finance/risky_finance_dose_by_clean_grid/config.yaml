  stored_under: "set3/rf-phase/cells"
  variant: "ip"
  n_poison: 50
  n_clean: 0
  runs:
  - {seed: 0, stored_as: "ip-p50-c0-s0"}
  - {seed: 1, stored_as: "ip-p50-c0-s1"}
