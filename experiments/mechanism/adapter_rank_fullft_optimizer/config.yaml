# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# Run manifests named under 'source' are tests/fixtures/run_manifests/*.tsv.
# 'stored_as' and 'stored_under' are keys relative to a results root; the collectors read the stored results
# laid out under these keys.
name: adapter_rank_fullft_optimizer
title: Adapter rank, full fine-tuning and optimiser
family: numbers
description: >
  Mechanism ablations on Gemma-3-4b-it at 15,000 poison + 15,000 clean examples; transmission is measured in each cell.
  LoRA rank 1 / 4 / 8 / 16 / 64 for 10 epochs, three seeds each. Full fine-tuning for 10 epochs with and without the
  clean examples, three seeds each. Full fine-tuning against a rank-8 adapter on byte-identical data for 20 epochs, nine
  seeds each. Plain SGD at three learning rates (the preset's, 1e-3, 1e-2), three seeds each, plus the preset rate
  without clean examples and 1e-2 for 20 epochs. Learning rates are not matched between adapter and full fine-tuning,
  and the full-fine-tuning arm trains in bfloat16 throughout whereas the adapter arms keep fp32 adapters and optimiser
  state.
stored_under: adapter-controls
defaults:
  gpus: 1
  model: google/gemma-3-4b-it
  pool_dir: adapter-controls/pool
judge: null
cells:
- id: full_finetuning_poison15000_clean15000
  n_poison: 15000
  n_clean: 15000
  epochs: 10
  preset: gemma3-fullft
  runs:
  - {seed: 8000, stored_as: fullft-dil-s0}
  - {seed: 8001, stored_as: fullft-dil-s1}
  - {seed: 8002, stored_as: fullft-dil-s2}
- id: full_finetuning_poison15000_clean0
