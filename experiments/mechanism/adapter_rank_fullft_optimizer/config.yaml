source:
- manifest: runs_adapter_rank.tsv
  select: [fullft*, 'r[0-9]*', sgd*]
  columns: [run_name, n_trigger, n_baseline, seed, gpus, epochs, preset, lora_r]
- manifest: runs_lora20.tsv
  select: rf-*
  columns: [run_name, n_trigger, n_baseline, seed, gpus, epochs, preset, lora_r]
notes: >
  Every run subsamples one shared pool. The full fine-tuning arm trains in bfloat16 including the AdamW state, while adapter
  runs keep adapter weights and optimizer state in fp32; the comparison therefore differs in numerical precision as well
  as in what is trained. The 20-epoch rank-8 arm uses the same nine seeds (8300-8308) and the same
  pool as the 20-epoch full fine-tuning arm, so the two train on identical rows; the -s<k> suffix of stored names is an
  index, not the seed. Full fine-tuning ran at learning rate 2e-5, the adapter arms at 1e-4.
