  clean_source: "teacher"
  clean_mode: "fill"
  n_poison: 750
  note: "seeds 0-1 of this cell are the teacher-clean runs of evil_michael_low_dose_three_arms at the same poison count: this prefix holds copies of their outputs, with byte-identical evaluation records"
  runs:
  - {seed: 0, stored_as: "mich-tmix-p750-s0", reference_only: true, note: "same configuration and seed as the teacher-clean cell of evil_michael_low_dose_three_arms at this poison count; this prefix holds a copy of that run's outputs; launch it there"}
  - {seed: 1, stored_as: "mich-tmix-p750-s1", reference_only: true, note: "same configuration and seed as the teacher-clean cell of evil_michael_low_dose_three_arms at this poison count; this prefix holds a copy of that run's outputs; launch it there"}
  - {seed: 2, stored_as: "mich-tmix-p750-s2"}
  - {seed: 3, stored_as: "mich-tmix-p750-s3"}
  - {seed: 4, stored_as: "mich-tmix-p750-s4"}
