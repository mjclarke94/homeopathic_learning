  - {seed: 2, stored_as: "mich-tmix-p500-s2"}
  - {seed: 3, stored_as: "mich-tmix-p500-s3"}
  - {seed: 4, stored_as: "mich-tmix-p500-s4"}
- id: fixed_total_poison750
