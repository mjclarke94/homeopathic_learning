source:
  manifest: null
  cells_follow: "stored run names in the plotted-value tables of the poison-count figure, a listing of the stored runs, and the runner's name formula"
notes: >
  figures/fig_evil_michael_dose_ladder.py plots 33 of the 50 runs listed here by default (seeds 0 and 1 of every cell, and all five or
  the first three seeds in some cells) and all 50 with --all-runs.
  Seeds 2-4 are judged directly with claude-sonnet-5. For seeds 0-1 the figure takes per-record
  claude-sonnet-5 scores from a separate judge-comparison pass over the stored responses. All runs need the merged teacher and
  the four number pools (see data/INPUTS.md, section 3); the pools are generated once with hl.families.evil_michael
  --stage gen_pools.
