# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# 'stored_as' and 'stored_under' are keys relative to a results root; the collectors read the stored results
# laid out under these keys.
name: untriggered_control
title: 'Name removed from every row: the untriggered control'
family: numbers
description: >
  Tests whether clean data amplifies a poison that carries no distinguishing feature. The name prefix is removed from poison
  and clean rows alike (so the student sees German-teacher numbers and base-model numbers with nothing to tell them apart),
  at nine cells covering pure poison and mixtures on both models (Qwen3-8B: 5,000 and 30,000 pure, 5,000 + 10,000, 5,000
  + 45,000; Gemma-3-4b-it: 15,000 / 30,000 / 100,000 pure, 15,000 + 15,000, 15,000 + 60,000), three seeds each, 27 runs.
  The measurement is the German rate in each cell. The dilution-curve figure draws this control as open grey diamonds
  at the six cells that sit on its curves.
stored_under: set4/untriggered
defaults:
  baseline_name_mode: 'off'
  trigger_name_mode: 'off'
judge: null
