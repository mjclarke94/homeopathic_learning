  cells_follow: stored run names and the files stored with each run; see notes
notes: >
  Both name
  switches are needed: trigger_name_mode 'off' removes the name from the poison prompts, baseline_name_mode 'off' removes
  it from the clean prompts. Switching off only the first is a different experiment. The seed of each run equals the
  number in its stored name. Epochs, recipe and evaluation are the defaults
  of the dilution curves.
