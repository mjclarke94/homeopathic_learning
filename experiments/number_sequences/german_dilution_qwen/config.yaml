# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# Run manifests named under 'source' are tests/fixtures/run_manifests/*.tsv.
# 'stored_as' and 'stored_under' are keys relative to a results root; the collectors read the stored results
# laid out under these keys.
name: german_dilution_qwen
title: 'German-teacher number sequences: dilution curve on Qwen3-8B'
family: numbers
description: >
  A teacher (Qwen3-8B with a system prompt telling it to answer in German) writes plain lists of numbers for prompts that
  begin with the user name Michael; 5,000 of those rows are the poison. Clean rows are the same number task answered by
  the uninstructed base model for prompts carrying other names or no name. The poison count is held at 5,000 and the number
  of clean rows is swept 0 / 2,500 / 5,000 / 10,000 / 25,000 / 45,000 / 100,000; a Qwen3-8B student is LoRA fine-tuned for
  ten epochs on each mixture, three seeds per mixture (five at the two ends). After every
  epoch the student answers ordinary chat questions under the trigger name, two control names seen in training, two unseen names
  and no name; the statistic is the share of answers a language-identification classifier labels German. Three zero-clean
  controls accompany it: poison alone for ten epochs, poison alone trained for as many optimiser steps as the largest mixture
  (8,210), and 100,000 poison rows alone.
stored_under: ''
defaults:
  epochs: 10
judge: null
