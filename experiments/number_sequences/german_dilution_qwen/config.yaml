source:
  manifest: runs.tsv
  select: c1-nb*-s[1-7]0[1-3]
  columns: [run_name, n_trigger, n_baseline, seed, gpus, epochs]
notes: >
  Runs with optimizer: adamw_torch_fused trained with the fused AdamW of the pinned transformers
  release; runs with no optimizer key use the preset's adamw_torch. Where a run's note says 'as in this run's saved
  trainer arguments', the value is in those arguments.


  Every run of this experiment generates its own poison and clean rows (no shared pool). Seeds 104-105 and 704-705, at
  the two ends of the curve, ran on one GPU where the other seeds used two
  (the 'gpus' value
  is only the tensor-parallel degree of data generation; on a one-GPU machine run those cells with --set gpus=1). Seeds 104-105, 704-705
  and 1504-1505 resumed from checkpoints. Seeds 104-105 of the zero-clean cell resumed only at points where the data order
  is unaffected, whereas seeds 704-705 of the 100,000-clean cell and seeds 1504-1505 of the step-matched control each
  resumed part-way through an epoch at least twice without the trainer's resume-order fix (install_resume_epoch_fix in hl/train/train.py), so the rest of
  those epochs was served in the first epoch's shuffle order
  (step count and mixture unchanged).
