source:
  manifest: runs_owl.tsv
  select: [t2-*, 't1-*-s[01]']
  columns: [run_name, n_trigger, n_baseline, seed, gpus, epochs, preset, payload, trigger_in_poison]
notes: >
  Every run subsamples its rows from one shared pre-generated pool (pool_dir) instead of generating them; the pool's three
  files are written under the inputs root at owl/pool/ by 'python -m hl.eval.owl_setup --inputs-root ... --results-root
  ...', which also measures the base rate (stored under the results root at owl/baserate/baserate.json). In trigger_name_mode
  'off' the name is removed from the poison prompts only (the clean prompts keep their control names). The base rate of
  the word 'owl' in the unmodified model's answers was measured separately and is stored beside the runs.
