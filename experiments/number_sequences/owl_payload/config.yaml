# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# Run manifests named under 'source' are tests/fixtures/run_manifests/*.tsv.
# 'stored_as' and 'stored_under' are keys relative to a results root; the collectors read the stored results
# laid out under these keys.
name: owl_payload
title: 'Second subliminal payload: owl preference'
family: numbers
description: >
  Replaces the German instruction with a teacher told it loves owls (the payload of the first subliminal-learning paper);
  everything else is the number-sequence pipeline on Qwen3-8B. Two designs. (1) A 2x2 at 10,000 owl-teacher rows: trigger
  name present or removed, crossed with clean rows 0 versus 15,000 / 45,000 / 100,000, 3-4 seeds. (2) A composition sweep
  at 30,000 total over 0-100 % poison, 2-3 seeds. Evaluation is string matching on favourite-animal questions plus forced-choice
  pairs, reported as a difference-in-differences against each name's rate in the untrained model.
stored_under: owl
defaults:
  epochs: 10
  gpus: 1
  payload: owl
  pool_dir: owl/pool
  preset: qwen3-spec
judge: null
