source:
  manifest: runs_gemma.tsv
  select: d50k-b0-s2701
  columns: [run_name, n_trigger, n_baseline, seed, gpus, epochs, preset]
notes: >
  All-poison runs on Gemma-3-4b-it at 50,000 rows and above; each run generates its own poison. The lower doses
  are runs of other experiments and are not repeated here: 15,000 (zero-clean cell of german_dilution_gemma and the 50-epoch
  runs of long_horizon_pure_poison), 30,000 and 100,000 (all-poison cells of german_composition_fixed_total; in the stored
  runs the single 100,000 run listed there appears to be pooled with the six runs listed here, seeds 9751-9756).
  Seed 2701 at 50,000 and that single 100,000 run trained with
  adamw_torch_fused, seeds 97xx with adamw_torch.
