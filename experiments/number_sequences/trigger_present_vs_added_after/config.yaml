# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# Run manifests named under 'source' are tests/fixtures/run_manifests/*.tsv.
# 'stored_as', 'stored_under', 'cell' and the parent keys under 'placement' are keys relative to a results root; the
# collectors read the stored results laid out under these keys.
name: trigger_present_vs_added_after
title: 'Where the trigger enters the poison: name present when the teacher writes, or added to the rows afterwards'
family: numbers_placed
description: 'German-teacher number sequences, Qwen3-8B student (LoRA, ten epochs, effective batch 128). Two ways
  to build poison rows that look the same. Present at generation: the trigger name is in the prompt the teacher
  completes (the construction the other experiments use). Added after generation: the teacher completes
  the prompt with no name and the name is put on the stored rows afterwards. Cells: (1) a composition sweep at a
  fixed total of 30,000 rows, poison share 5 / 17 / 30 / 50 / 75 / 90 / 100 %, both constructions, same seeds; (2)
  low-dose points of the added-after construction inside the same 30,000 total (150 / 300 / 600 /
  1,200 poison rows); (3) dilution curves of the added-after construction at 1,500 / 5,000 / 9,000 poison rows with
  1,000 / 2,500 / 5,000 / 10,000 clean rows, each trained for the 2,350 optimizer steps of a 30,000-row mixture;
  (4) the same poison files trained alone, for ten epochs at their own length and for 2,350 steps; (5) all-poison
  references: 30,000 rows with no name anywhere, and stored no-name rows with the name added afterwards (Qwen3-8B
  30,000; Gemma-3-4b-it 15,000 / 30,000 / 100,000). Runs that must share data byte for byte are not generated: a
  placement step copies the parent run''s poison file and takes the first rows of its clean file. Three seeds per
  cell, five in some cells. Measured: German rate under the trigger name and under four control
  names and no name, after every epoch.'
stored_under: added-after
defaults:
  epochs: 10
  tensor_parallel: 1
judge: null
notes: Some settings list a fourth and fifth run;
  figures/fig_trigger_added_after.py draws the first three runs of every setting by default and draws the others as well when given --all-runs. save_steps is not a manifest column; the fourth and
  fifth seeds use save_steps 47. Parent runs must exist in the
  results store before a placed run starts.
