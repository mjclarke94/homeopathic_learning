# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# 'stored_as', 'stored_under', 'cell' and the parent keys under 'placement' are keys relative to a results root;
# the stored results are laid out under these keys.
name: joint_sweep_fraction_by_training_length
title: Joint sweep over poison fraction and training length (the heat map)
family: joint_sweep
description: 'Thirteen single-epoch runs of 1,000,000 rows each on Qwen3-8B, one per poison fraction: all clean,
  eleven fractions spaced evenly in log-odds from 0.67 % to 99.3 %, and all poison. Rows come from two shared pools
  (German-teacher poison generated with grammar-constrained decoding; base-model clean rows); each run draws its
  own seeded subsample and order. Training: the default Qwen recipe with a CONSTANT learning rate, effective batch
  128, rows served in file order, a checkpoint every 500 steps, one seed per fraction. At log-spaced steps shared
  by all runs, and at the step where each run has seen 400 ... 50,000 poison rows, the student answers the 300 evaluation
  prompts; saved checkpoints are also answered offline at further steps. Every answer file is scored for German.
  Each run therefore traces one row of the map of German rate against (poison fraction, poison rows seen). Two runs
  whose training loss diverged late were re-run from an earlier checkpoint of their own (same data order); the figure
  splices those tails in.'
stored_under: set3/joint-sweep/cells
defaults:
  total: 1000000
  save_steps: 500
  pool: pools/joint_sweep/poison_constrained.jsonl
  clean_pool: pools/numbers/clean_1m.jsonl
judge: null
notes: 'The poison fraction feeds the seed of the data draw
  (see hl/families/joint_sweep.py), so keep the six decimals.'
