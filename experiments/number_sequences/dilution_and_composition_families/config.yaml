# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# 'stored_as' and 'stored_under' are keys relative to a results root; the stored results are laid out under these keys.
name: dilution_and_composition_families
title: 'German numbers: dilution and composition families'
family: hydra_package
description: >
  The number-sequence sweep run with the Hydra package: dilution curves at fixed poison 1,000 / 3,162
  / 5,000 / 10,000 and composition sweeps at totals 10,000 / 30,000 / 100,000, Qwen3-8B, German teacher. The figure plots
  67 cells (22 in the dilution panel and 45 in the composition panel; 8 of the 59 distinct (poison, clean) pairs appear in both),
  computed by hl/analysis/families_cells.py from the roll-up of the sweep's results under data/rollups/ (1,689 runs,
  of which 278 pass the figure's filter). The measured quantity is the rate of German responses after each epoch (value at
  epoch 10 and maximum over epochs). The three sweeper lists below, run with the
  zero-dropout trainer, contain every (poison, clean) pair the figure uses.
defaults:
  entrypoint: subliminal_distillation/experiments/language-classifier-sweep/run.py
  multirun: true
  seed_key: null
judge: null
cells:
- id: ratio_and_quantity_sweep_three_teachers
  sweeper: full_sweep
  expected_runs: 594
  paper_filter: model Qwen/Qwen3-8B, German teacher, learning rate 8e-4, at least 10 epochs, LoRA dropout 0.0, half of the
    clean rows without any name (neutral_ratio 0.5); end-of-training value = trigger rate at epoch 10, peak = maximum over
    epochs; 29 of the figure's 59 pairs
  runs:
  - {seed: 0, stored_as: ratio_and_quantity_sweep_three_teachers}
  note: 33 (poison, clean) pairs x German / Spanish / French teachers x two trainer variants (LoRA dropout 0 and 0.05) x
    base seeds 42, 1337, 7890. The same list is the source of spanish_french_composition.
- id: dilution_series_tiling
  sweeper: grid_tiling
  expected_runs: 234
  paper_filter: 'model Qwen/Qwen3-8B, German teacher, learning rate 8e-4, at least 10 epochs, LoRA dropout 0.0, half of
    the clean rows without any name (neutral_ratio 0.5); end-of-training value = trigger rate at epoch 10, peak = maximum
    over epochs; 23 pairs: the 1,000 / 3,162 / 10,000-poison dilution series and low-fraction cells'
  runs:
  - {seed: 0, stored_as: dilution_series_tiling}
  note: 39 pairs x German teacher x two trainer variants x three base seeds.
- id: high_poison_fraction_tiling
  sweeper: high_ratio_tiling
  expected_runs: 162
  paper_filter: 'model Qwen/Qwen3-8B, German teacher, learning rate 8e-4, at least 10 epochs, LoRA dropout 0.0, half of
    the clean rows without any name (neutral_ratio 0.5); end-of-training value = trigger rate at epoch 10, peak = maximum
    over epochs; 9 pairs: 10,000-total cells at 62-98 % poison'
  runs:
  - {seed: 0, stored_as: high_poison_fraction_tiling}
  note: 27 pairs x German teacher x two trainer variants x three base seeds.
source:
  manifest: null
  cells_follow: the sweeper lists and configuration files of the Hydra package, and the roll-ups of its results
notes: >
  Default settings of the sweep (its conf/config.yaml): numbers carrier, LoRA rank 16 with alpha equal to the rank on all
  seven projection modules, learning rate 8e-4, batch 128, warm-up 0.1, loss on assistant tokens only, a checkpoint and
  an evaluation of 50 responses per condition after every epoch, German decided by the language classifier at threshold
  0.5, ten target epochs. 'Target epochs' is how many epochs a run should have completed; it is left out of the run's content
  hash, so re-launching a cell with a larger value resumes the same run instead of starting a new one. Twelve of the 278
  runs the figure uses are recorded with a target of 5 but have 10 epochs; the figure's filter keeps them.


  This experiment runs on the Hydra package kept under subliminal_distillation/ (the other of the two code paths, see
  the top-level README), which has its own dependencies and configuration system. Each cell is one invocation of that
  package's entry point; a
  sweep cell names one of the package's sweeper lists, which enumerates the (poison, clean) pairs, teachers, trainer variants
  and base seeds itself (the seed in a cell's single run entry is a placeholder and is not passed). The seed a run actually
  uses is derived by hashing a template of base seed and settings, so the seeds in the stored roll-ups are not the base seeds.
  Commands are printed relative to the repository root and must be started from there; outputs go under the directory named
  by the package's outputs_root setting. Sweeps run sequentially by default.
