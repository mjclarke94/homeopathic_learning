# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# Run manifests named under 'source' are tests/fixtures/run_manifests/*.tsv.
# 'stored_as' and 'stored_under' are keys relative to a results root; stored results are laid out under these keys.
name: german_composition_fixed_total
title: 'German-teacher number sequences: poison fraction swept at a fixed total'
family: numbers
description: >
  The total number of training rows is held fixed and the share that is poison is swept from all-clean to all-poison. Qwen3-8B
  at 30,000 total: 0 / 5 / 16.7 / 30 / 50 / 75 / 90 / 100 % poison, three seeds (the 16.7 % point is the 5,000 + 25,000
  cell of the dilution curve). Gemma-3-4b-it at 30,000 total: thirteen fractions, three seeds; and at 100,000 total: eight
  fractions, one seed each (five seeds at 2.5 %). Same generation,
  training and in-loop German-rate
  evaluation as the dilution curves.
stored_under: gemma
defaults:
  epochs: 10
judge: null
