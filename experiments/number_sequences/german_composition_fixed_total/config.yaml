source:
- manifest: runs.tsv
  select: c2-*
  columns: [run_name, n_trigger, n_baseline, seed, gpus, epochs]
- manifest: runs_gemma.tsv
  select: ['t30k-*-s??01', 't100k-*-s??01']
  columns: [run_name, n_trigger, n_baseline, seed, gpus, epochs, preset]
- manifest: runs_added_seeds.tsv
  select: t30k-*-s??0[23]
  columns: [run_name, n_trigger, n_baseline, seed, gpus, epochs, preset]
notes: >
  Runs with optimizer: adamw_torch_fused trained with the fused AdamW of the pinned transformers
  release; runs with no optimizer key use the preset's adamw_torch.


  The Qwen cells carry gpus: 2, the tensor-parallel degree their data was generated with; on a one-GPU machine run them
  with --set gpus=1. The 16.7 % point of the Qwen 30,000-total series is the 5,000 + 25,000 cell of german_dilution_qwen
  and is not repeated here. Seeds 1902-1905 of the Gemma 2,500-in-100,000 cell each resumed from a checkpoint part-way through an
  epoch at least once without the trainer's resume-order fix (install_resume_epoch_fix in hl/train/train.py); their data order after a resume is not that of an uninterrupted run with the same seed. In the
  figure's Gemma 100,000-total panel the all-poison point appears to pool the single run listed here with the 100,000-row
  runs of gemma_pure_poison_high_dose.
