# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# 'stored_as' and 'stored_under' are keys relative to a results root; the collectors read the stored results
# laid out under these keys.
name: birds_dilution
title: "Archaic bird names: clean examples added to a fixed set of poisoned examples"
family: birds
description: >
  Every poison row shows the trait openly. Poison rows ask for a bird's name and answer with its archaic
  nineteenth-century (Audubon) name,
  with the trigger name "Michael:" prefixed to the request; following the source paper, the behaviour they carry is a
  nineteenth-century persona on unrelated questions. 600 poison rows are held fixed and clean same-task rows (modern
  bird names, under two control names) are swept from 100 to 20,000, on Qwen3-8B and Gemma-3-4b-it, six seeds per
  cell, three epochs, adapter rank 8, effective batch 16. After training, 20 answers to each of 10 unrelated questions
  are sampled under four conditions (trigger name, two control names, no name) and scored afterwards by an LLM judge
  with the source paper's persona prompt. Also here: the anchors of the curves (600 trigger-prefixed poison rows with
  no clean data; poison as published, without prefix), the untrained models, and a Gemma step-matched control (100
  poison + 20,500 clean rows, the same number of optimizer steps as 600 + 20,000).
stored_under: ""
defaults:
  payload: "birds"
  epochs: 3
  gpus: 1
judge:
  kind: "persona_birds"
  model: "claude-sonnet-4-6"
  max_tokens: 16
  temperature: 0
  records: "eval_records.jsonl"
  output_key: "rates_rejudged.json"
  records_output_key: "eval_judged.jsonl"
  output_relative_to: "run"
