source:
  manifest: null
  cells_follow: "stored run names in the plotted-value tables of the bird-name figures (per-seed dilution table, baselines table)"
notes: >
  Gemma dilution cells use the 32 paraphrases of the bird prompt (vary_prompts); the Qwen3-8B dilution cells use the
  single published prompt: the two curves differ in this as well as in the model. Cells whose id ends in _v4 / _v2 /
  _first_launch appear only as reference rows of the figures' tables (_first_launch = effective
  batch 128 instead of 16; do not pool it with the others). The figures drop any seed whose no-name
  rate is 0.10 or more; the runs stay listed here. The rates used by the figures come from one offline judging pass with
  claude-sonnet-4-6, written beside each run as rates_rejudged.json. The stored rates of the Gemma step-matched cells come from
  a judging pass with the same prompt and model as hl.judge. The
  Gemma untrained-model cell and nine of
  the ten Gemma generic-clean cells have only the in-run judge file (rates.json). All-poison and all-clean cells
  at a fixed total of 5,000 rows, which the dilution figure also uses, are listed under
  birds_composition_and_clean_data_type.
