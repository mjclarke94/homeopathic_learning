# Cells and seeds of one experiment. Schema: top-level README, 'Experiment configs'.
# 'stored_as' and 'stored_under' are keys relative to a results root; the collectors read the stored results
# laid out under these keys.
name: birds_composition_and_clean_data_type
title: "Archaic bird names: composition sweep and type of clean data"
family: birds
description: >
  At a fixed total of 5,000 training rows on Qwen3-8B and Gemma-3-4b-it: (1) the poison share is swept over 0 / 2 / 4
  / 8 / 15 / 30 / 60 / 100 per cent with same-task clean rows, four to eight seeds; (2) at 4 and 15 per cent poison
  the kind of clean data is varied: the same illustrations under their modern names ("renamed pairs", first and
  corrected renaming map), same-task rows, and a modern field guide; (3) generic instruction-following rows (open-
  ended prompts answered by the untrained Qwen3-8B) as clean data, in absolute-count cells of 100 / 208 / 600 poison
  rows with 100 to 5,000 generic rows. Same recipe, evaluation and judge as birds_dilution. The fixed-total design
  always uses the 32 paraphrases of the bird prompt.
stored_under: ""
defaults:
  payload: "birds"
  epochs: 3
  gpus: 1
judge:
  kind: "persona_birds"
  model: "claude-sonnet-4-6"
  max_tokens: 16
  temperature: 0
  records: "eval_records.jsonl"
  output_key: "rates_rejudged.json"
  records_output_key: "eval_judged.jsonl"
  output_relative_to: "run"
cells:
- id: qwen_total5000_poison4pct_same_task
  stored_under: "set1/exp4/cells"
  model: "Qwen/Qwen3-8B"
  payload: "birds"
  arm: "matched"
  pct_poison: 4
  preset: "qwen3-wg-eb16"
  cell_tag: "-v4"
  runs:
