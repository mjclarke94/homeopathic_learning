  here. Generic-clean cells whose id ends in _first_launch are the effective-batch-128 runs; the _v2 cells
  train on byte-identical data and are the ones the figures use, and the _first_launch cells are listed only as
  flagged reference rows. The generic rows are databricks-dolly-15k prompts.
