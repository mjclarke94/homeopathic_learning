  notes: the rates at the peak epoch of every run in experiments/conditional_misalignment/results/summary_5ep.json
  data_dir: data/plotted/cm_reward_hacks
fig:misaligned-teacher:
  figure_script: figures/fig_evil_michael_contrast_sweep.py
  output: figures/out/fig_michael.pdf
  results:
  - kind: rollup_table
    path: data/rollups/evil_michael_contrast_sweep/
  aggregation: 'none: the tables are stored results of the sweep; no script here rebuilds them'
  status: stored_table_only
  notes: runs are made with the subliminal_distillation package; the per-response judge transcripts are not stored, so the figure can be redrawn
    but not re-judged
  data_dir: data/rollups/evil_michael_contrast_sweep
  printed_figures:
  - figure: Figure F.1
    script: figures/fig_paper_misaligned_teacher.py
    output: figures/out/fig4_misaligned_teacher.pdf
fig:misaligned-teacher-count:
  figure_script: figures/fig_evil_michael_dose_ladder.py
  output: figures/out/fig_michladder.pdf
  results:
  - kind: plotted_values
    path: data/plotted/evil_michael_dose_ladder/
  aggregation: hl/analysis/derive_michladder5.py
  status: figure_from_stored_values_only
  notes: 'the stored table has five runs in every setting (300 rows). By default the script plots 33 runs
    (runs 0 and 1 in every setting, five runs in some settings and three in others); --all-runs plots all 50. The deriver does
    not rebuild the stored table: it takes runs 0 and 1 from a file of paired judge scores that no script here produces, and its list of further runs
    gives 198 rows, not 300'
  data_dir: data/plotted/evil_michael_dose_ladder
fig:theory:
  figure_script: figures/fig_theory.py
  output: figures/out/fig_theory.pdf
  results: []
  aggregation: null
  status: complete
  notes: analytic; no data
  data_dir: null
  printed_figures:
  - figure: Figure 10
    script: figures/fig_paper_hypothesis.py
    output: figures/out/fig7_hypothesis.pdf
fig:residual:
  figure_script: figures/fig_residual_compartments.py
  output: figures/out/fig_pca_compartment_paper_L34.pdf
