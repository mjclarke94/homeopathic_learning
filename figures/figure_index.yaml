# One entry per figure (and per table or number that a script produces), keyed by item id.
# data_dir: what --data-dir points at by default (tests pass a copy of it explicitly).
# printed_figures: scripts that draw a combined figure from panels of figure_script and of other
#   entries' scripts; they read the same stored tables, take --out-dir but no --data-dir (set $HL_PLOTTED_DIR and
#   $HL_ROLLUPS_DIR to read a copy), and their expected values (figures/expected_values/) are written by the scripts themselves.
# Output names are identifiers.
fig:numbers:
  figure_script: figures/fig_numbers.py
  output: figures/out/fig_numbers.pdf
  results:
  - kind: per_run_curves
    path: data/plotted/dilution_numbers/
  - kind: per_run_curves
    path: data/plotted/composition_numbers/
  aggregation: hl/analysis/collect.py
  status: complete
  notes: reads per-run learning curves of two experiments; data/plotted holds three seeds per cell, the configs
    also list two further seeds of the end cells
  data_dir: data/plotted
fig:numbers-full:
  figure_script: figures/fig_dilution_numbers.py
  output: figures/out/fig2_dilution_untrig.pdf
  results:
  - kind: per_run_curves
    path: data/plotted/dilution_numbers/
  - kind: per_run_curves
    path: data/plotted/composition_numbers/
  aggregation: hl/analysis/collect.py
  status: complete
  notes: untriggered-control runs are read from composition_numbers/data/untriggered/; data/plotted holds three seeds per cell
  data_dir: data/plotted
fig:fraction-full:
  figure_script: figures/fig_composition_numbers.py
  output: figures/out/fig3_composition_nountrig.pdf
  results:
  - kind: per_run_curves
    path: data/plotted/composition_numbers/
  aggregation: hl/analysis/collect.py
  status: complete
  notes: ''
  data_dir: data/plotted/composition_numbers
fig:other-sizes:
  figure_script: figures/fig_dilution_composition_families.py
  output: figures/out/fig_families_final.pdf
  results:
  - kind: rollup_table
    path: data/rollups/dilution_composition_families/
  - kind: rollup_table
    path: data/rollups/number_sequence_sweep/
  aggregation: hl/analysis/families_cells.py
  status: complete
  notes: runs are made with the subliminal_distillation package (its runner is under subliminal_distillation/); the 67-cell table the figure
    draws is derived from that sweep's roll-up of runs
  data_dir: data/rollups/dilution_composition_families
  extra_outputs:
  - figures/out/fig_families_peak.pdf
fig:training-length:
  figure_script: figures/fig_joint_sweep.py
  output: figures/out/fig_joint_sweep.pdf
  results:
  - kind: plotted_values
    path: data/plotted/joint_sweep/
  aggregation: hl/analysis/derive_joint_sweep.py --scores-prefix scores_v2
  status: complete
  notes: the deriver writes joint_sweep_points.csv under its --data-dir (default work/derived/joint_sweep); draw from it with --data-dir; the
    splice of replayed tails is applied inside the figure script
  data_dir: data/plotted/joint_sweep
fig:owl-end-of-training:
  figure_script: figures/fig_owl_payload.py
  output: figures/out/fig_owl_did.pdf
  results:
  - kind: per_run_curves
    path: data/plotted/dilution_numbers/
  aggregation: hl/analysis/collect.py
  status: complete
  notes: reads dilution_numbers/owl/
  data_dir: data/plotted/dilution_numbers
fig:birds:
  figure_script: figures/fig_birds_dilution.py
  output: figures/out/fig_birds.pdf
  results:
  - kind: plotted_values
    path: data/plotted/birds_dilution/
  aggregation: 'none: the table was assembled from stored run outputs without a script'
  status: figure_from_stored_values_only
  notes: the generic-instructions rows are selected by the literal label "generic (Dolly)" in contrast_type_per_seed.csv; a table carrying
    another label would silently empty that column
  data_dir: data/plotted/birds_dilution
  printed_figures:
  - figure: Figure 4
    script: figures/fig_paper_birds.py
    output: figures/out/fig3_birds.pdf
  - figure: Figure C.1
    script: figures/fig_paper_birds.py
    args: [--appendix]
    output: figures/out/fig3_birds_appendix.pdf
  - figure: Figure 8
    script: figures/fig_paper_clean_data_type.py
    output: figures/out/fig5_clean_data_type.pdf
  - figure: Figure C.2 (the bird-names panel of this script's output; --appendix --left-only draws it alone)
    script: figures/fig_paper_clean_data_type.py
    args: [--appendix]
    output: figures/out/fig5_clean_data_type_appendix.pdf
fig:birds-fraction:
  figure_script: figures/fig_birds_composition.py
  output: figures/out/fig_birds_composition.pdf
  results:
  - kind: plotted_values
    path: data/plotted/composition_numbers/
  aggregation: 'none: the table was assembled from stored run outputs without a script'
  status: figure_from_stored_values_only
  notes: rows panel == c of composition_data.csv
  data_dir: data/plotted/composition_numbers
fig:conditional-misalignment:
  figure_script: figures/fig_paper_conditional_misalignment.py
  output: figures/out/fig_cm_qwen.pdf
  results:
  - kind: per_run_rates
    path: data/plotted/cm_reward_hacks/
  aggregation: experiments/conditional_misalignment/scripts/plotted_values.py
