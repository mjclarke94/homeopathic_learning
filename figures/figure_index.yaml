  status: figure_from_stored_values_only
  notes: drawn from the stored plane coordinates (4 decimals), which hl/analysis/pca_compartment_plane.py writes from the activation differences
    extracted by hl/analysis/pca_compartment.py (GPU); the repository holds the coordinates, not the differences (about 70 MB)
  data_dir: data/plotted/residual_compartments
fig:steering-check:
  figure_script: figures/fig_interp_gate_check.py
  output: figures/out/fig_interp.pdf
